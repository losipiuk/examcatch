[project]
name = "examcatch"
version = "0.1.0"
description = "Watches info-kierowca.pl for practical driving exam slots and reserves one up to the payment step"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "PyYAML>=6.0",
]

[project.scripts]
examcatch = "examcatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examcatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
