# ExamCatch configuration. Copy to config.yaml (ignored by git) and adjust.
# Any value may reference an environment variable with "${NAME}".

centers:
  # id: exam center id used by the service API
  # name: exactly as shown in the reservation form
  # Only the WORD holding your PKK profile accepts reservations; list just that one.
  # Other Warsaw center: id 26, WORD Warszawa M/E Bemowo.
  - id: 25
    name: WORD Warszawa M/E Odlewnicza

search:
  window_days: 14          # look for slots within this many days from now
  start_time_from: "10:00" # allowed exam start time range (inclusive)
  start_time_to: "15:00"
  min_lead_hours: 6        # minimum time from now to the exam start

polling:
  # The service allows 10 requests per hour per API endpoint; checks alternate between its two schedule endpoints.
  check_interval_seconds: 210            # ~17 checks per hour in total
  reservation_reserve_requests: 2        # full-schedule requests kept for the reservation form
  detector_reserve_requests: 1           # nearest-slot requests kept in reserve
  # After losing a slot to someone else, their unpaid hold expires 30 min after they reserved it, i.e. between
  # (last time we saw the slot + 30 min) and (our failed attempt + 30 min); checks are spread over that window.
  release_checks_in_window: 3
  release_check_grace_minutes: 1         # one more check after the window, in case cancellation lags; 0 disables

payment:
  hold_minutes: 30              # how long the service holds an unpaid reservation
  reminder_interval_minutes: 5

browser:
  profile_dir: .examcatch/profile
  screenshots_dir: .examcatch/screenshots

logging:
  # Everything printed to the terminal is also appended to this file (ignored by git).
  enabled: true
  file: .examcatch/examcatch.log

notifications:
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 587
    starttls: true
    username: "${EXAMCATCH_SMTP_USERNAME}"
    password: "${EXAMCATCH_SMTP_PASSWORD}"
    from: "${EXAMCATCH_SMTP_USERNAME}"
    to:
      - you@example.com
  callmebot:
    enabled: true
    phone: "+48123456789"
    api_key: "${EXAMCATCH_CALLMEBOT_API_KEY}"
